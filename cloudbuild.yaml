  # Step 3: Compile and build the Web App
  - name: 'node:lts'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - '_CONFIG=$_CONFIG'
      
  # Step 4: Deploy using the pinned stable Firebase CLI image (15.21.0)
  - name: 'us-docker.pkg.dev/firebase-cli/us/firebase:15.21.0'
    args: ['deploy', '--project=$PROJECT_ID', '--only=hosting']

# Enable logging for Custom Service Account
options:
