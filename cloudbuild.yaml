#https://cloud.google.com/cloud-build/docs/deploying-builds/deploy-firebase
steps:
  # Step 1: Clone submodules
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
    - '-c'
    - |
      set -e
      # Fetch the societySidekick-common submodule from its public GitHub URL (in .gitmodules).
      # `submodule sync` resets any cached/rewritten URL (e.g. an old Cloud Source mirror) back to
      # the .gitmodules value before fetching.
      git submodule sync --recursive
      git submodule update --init --recursive
      echo "src/common..."
      ls -a ./src/common
      # Fail fast with a clear message if the submodule did not populate.
      test -f ./src/common/constants.js || { echo "ERROR: src/common submodule did not populate"; exit 1; }
